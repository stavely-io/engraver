name: Label PR type
description: Syncs the conventional commit type and breaking-change labels on a PR with its title.

runs:
  using: composite
  steps:
    - name: Label type from PR title
      uses: actions/github-script@v9
      with:
        script: |
          const { default: labelPrType } = await import("${{ github.action_path }}/script.ts");
          await labelPrType({ github, context });

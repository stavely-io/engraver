name: Run checks
description: Runs vp check, tests and publint for a single workspace package.

inputs:
  directory:
    description: "Package directory relative to the repo root, ex.: 'packages/core'"
    required: true
  check:
    description: "Run 'vp check'"
    required: false
    default: "true"
  test:
    description: "Run 'vp test'"
    required: false
    default: "true"
  publint:
    description: "Run 'publint'"
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Run vp check
      if: ${{ inputs.check == 'true' }}
      shell: bash
      run: vp -C ${{ inputs.directory }} check

    - name: Run tests
      if: ${{ inputs.test == 'true' }}
      shell: bash
      run: vp -C ${{ inputs.directory }} test

    - name: Run publint
      if: ${{ inputs.publint == 'true' }}
      shell: bash
      run: vp -C ${{ inputs.directory }} exec publint

name: "Check vexflow"

on:
  workflow_call:

jobs:
  vexflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-env
        with:
          playwright-browsers: "chromium"

      - uses: ./.github/actions/build

      - uses: ./.github/actions/run-checks
        with:
          directory: packages/vexflow

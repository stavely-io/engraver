name: "PR Check"

on:
  pull_request:
    branches:
      - main

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      vexflow: ${{ steps.filter.outputs.vexflow }}
      core: ${{ steps.filter.outputs.core }}
      react: ${{ steps.filter.outputs.react }}
      react-example: ${{ steps.filter.outputs.react-example }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Filter paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared: &shared
              - ".github/**"
              - "package.json"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
              - "tsconfig.json"
              - "vite.config.ts"
            vexflow:
              - *shared
              - "packages/vexflow/**"
            core:
              - *shared
              - "packages/core/**"
              - "packages/vexflow/**"
            react:
              - *shared
              - "packages/react/**"
              - "packages/core/**"
              - "packages/vexflow/**"
            react-example:
              - *shared
              - "apps/react-example/**"
              - "packages/react/**"
              - "packages/core/**"
              - "packages/vexflow/**"

  vexflow:
    needs: changes
    if: needs.changes.outputs.vexflow == 'true'
    uses: ./.github/workflows/vexflow.yml

  core:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    uses: ./.github/workflows/core.yml

  react:
    needs: changes
    if: needs.changes.outputs.react == 'true'
    uses: ./.github/workflows/react.yml

  react-example:
    needs: changes
    if: needs.changes.outputs.react-example == 'true'
    uses: ./.github/workflows/react-example.yml

  gate:
    if: always()
    needs: [changes, vexflow, core, react, react-example]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed or was cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1

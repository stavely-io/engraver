name: "PR Check"

on:
  pull_request:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup vite-plus
        uses: voidzero-dev/setup-vp@v1.22.0

      - name: Build @engraver/vexflow
        run: vp run @engraver/vexflow#build

      - name: Pack @engraver/core
        run: vp -C packages/core pack

      - name: Pack @engraver/react
        run: vp -C packages/react pack

      - name: Install Playwright Chromium
        run: vp dlx playwright install chromium --with-deps

      - name: Run vp check
        run: vp check

      - name: Run publint
        run: vp run -r publint

      - name: Run tests
        run: vp run -r test

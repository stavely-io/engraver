name: "PR conflicts"

on:
  push:
  pull_request_target:
    types: [synchronize]

jobs:
  label:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Label PRs with merge conflicts
        uses: eps1lon/actions-label-merge-conflict@v3.1.0
        with:
          dirtyLabel: conflicts
          repoToken: ${{ secrets.GITHUB_TOKEN }}

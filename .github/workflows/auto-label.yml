name: "Auto label"

# pull_request_target runs with write access on fork PRs too.
# None of these jobs check out PR code, so that's safe.
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]
  issues:
    types: [opened]

jobs:
  pr-packages:
    if: github.event_name == 'pull_request_target' && github.event.action != 'edited'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Label packages from changed paths
        uses: actions/labeler@v7
        with:
          sync-labels: true

  pr-type:
    if: github.event_name == 'pull_request_target' && github.event.action != 'synchronize'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Label type from PR title
        uses: actions/github-script@v9
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        with:
          script: |
            const types = ["feat", "fix", "docs", "style", "refactor", "perf", "test", "build", "ci", "chore", "revert"];
            const breaking = "breaking-change";

            const match = process.env.PR_TITLE.match(/^(\w+)(\([^)]*\))?(!)?:/);
            const type = match && types.includes(match[1]) ? match[1] : null;
            const isBreaking = Boolean(match?.[3]);

            const wanted = new Set([type, isBreaking && breaking].filter(Boolean));
            const managed = new Set([...types, breaking]);

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const current = context.payload.pull_request.labels.map((label) => label.name);

            for (const name of current) {
              if (managed.has(name) && !wanted.has(name)) {
                await github.rest.issues.removeLabel({ owner, repo, issue_number, name });
              }
            }

            const toAdd = [...wanted].filter((name) => !current.includes(name));
            if (toAdd.length > 0) {
              await github.rest.issues.addLabels({ owner, repo, issue_number, labels: toAdd });
            }

  issue-package:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Label package from issue form
        uses: actions/github-script@v9
        with:
          script: |
            const packages = ["core", "react"];

            // Issue forms render each field as "### <label>\n\n<answer>".
            const body = context.payload.issue.body ?? "";
            const answer = body.match(/^### Package\s*\n+(.+)$/m)?.[1].trim();
            if (!packages.includes(answer)) return;

            await github.rest.issues.addLabels({
              ...context.repo,
              issue_number: context.payload.issue.number,
              labels: [`pkg:${answer}`],
            });

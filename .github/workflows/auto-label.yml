name: "Auto label"

on:
  issues:
    types: [opened]
  push:
  pull_request_target:
    types: [synchronize]

jobs:
  issue-package:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout actions
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/actions

      - name: Label package from issue form
        uses: ./.github/actions/label-issue-package

  pr-conflicts:
    if: github.event_name != 'issues'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Label PRs with merge conflicts
        uses: eps1lon/actions-label-merge-conflict@v3.1.0
        with:
          dirtyLabel: conflicts
          repoToken: ${{ secrets.GITHUB_TOKEN }}

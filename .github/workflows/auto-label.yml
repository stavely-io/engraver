name: "Auto label"

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]
  issues:
    types: [opened]

jobs:
  pr-packages:
    if: github.event_name == 'pull_request_target' && github.event.action != 'edited'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Label packages from changed paths
        uses: actions/labeler@v7
        with:
          sync-labels: true

  pr-type:
    if: github.event_name == 'pull_request_target' && github.event.action != 'synchronize'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup environment
        uses: ./.github/actions/setup-env

      - name: Label type from PR title
        uses: ./.github/actions/label-pr-type

  issue-package:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout actions
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/actions

      - name: Label package from issue form
        uses: ./.github/actions/label-issue-package

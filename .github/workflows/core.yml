name: "Check core"

on:
  workflow_call:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup environment
        uses: ./.github/actions/setup-env

      - name: Build
        uses: ./.github/actions/build

      - name: Run Checks
        uses: ./.github/actions/run-checks
        with:
          directory: packages/core
          publint: "true"

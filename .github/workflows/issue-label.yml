name: "Issue label"

on:
  issues:
    types: [opened]

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout actions
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/actions

      - name: Label package from issue form
        uses: ./.github/actions/label-issue-package
